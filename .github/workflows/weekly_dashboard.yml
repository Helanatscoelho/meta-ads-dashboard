name: Dashboard Meta Ads — Atualização Semanal

on:
  schedule:
    - cron: "0 11 * * 1"   # toda segunda às 08:00 BRT (11:00 UTC)
  workflow_dispatch:         # permite rodar manualmente no GitHub

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Gerar dashboard HTML
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
        run: python fetch_and_generate.py

      - name: Gerar relatório Excel
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
        run: python meta_ads_control.py

      - name: Publicar no GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages
          include_files: |
            index.html
            dashboard_latest.html
            dashboard_*.html
          keep_files: false
          commit_message: "dashboard: atualização ${{ github.run_id }}"
